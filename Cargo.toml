[package]
name = "bulin"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14.0", default-features = false, features = [
    "wgpu",
    "webgl",
    "highlighter",
    "tokio",
    "debug",
    "image",
    "advanced",
    "fira-sans",
] }

iced_highlighter = "0.14.0"
iced_wgpu = "0.14.0"
iced_aw = { version = "0.14.1", default-features = false, features = [
    "number_input",
] }
iced-code-editor = "0.3.9"
bytemuck = "1.23"
rfd = "0.15.4"
once_cell = "1.21"
syntect = { version = "5.2", default-features = false, features = [
    "default-fancy",
] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.137"
num-traits = "0.2.19"
wasmtimer = { version = "0.4" }
thiserror = "2.0"
tracing = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing-subscriber = "0.3"
tokio = { version = "1.47", default-features = false, features = ["fs"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
console_error_panic_hook = "0.1"
console_log = "1.0"
