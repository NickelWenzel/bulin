[package]
name = "bulin"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.15.0-dev", default-features = false, features = [
    "wgpu",
    "webgl",
    "web-colors",
    "x11",
    "wayland",
    "tokio",
    "debug",
    "image",
    "advanced",
    "fira-sans",
] }
iced_palace = "0.15.0-dev"
scrive-core = "0.3.0"
scrive-iced = "0.3.0"
bytemuck = "1.23"
rfd = "0.17.2"
once_cell = "1.21"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.137"
num-traits = "0.2.19"
wasmtimer = { version = "0.4" }
thiserror = "2.0"
tracing = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing-subscriber = "0.3"
tokio = { version = "1.47", default-features = false, features = ["fs"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }
console_error_panic_hook = "0.1"
console_log = "1.0"

[patch.crates-io]
iced = { git = "https://github.com/iced-rs/iced.git", rev = "10e9b995eb5af74dbac08ed62b01971fe7e495b2" }
iced_core = { git = "https://github.com/iced-rs/iced.git", rev = "10e9b995eb5af74dbac08ed62b01971fe7e495b2" }
iced_widget = { git = "https://github.com/iced-rs/iced.git", rev = "10e9b995eb5af74dbac08ed62b01971fe7e495b2" }
iced_palace = { git = "https://github.com/hecrj/iced_palace.git" }
scrive-core = { git = "https://github.com/NickelWenzel/scrive.git", rev = "6cf4f2c9e066bcf398b371719c90173fae223dbf" }
scrive-iced = { git = "https://github.com/NickelWenzel/scrive.git", rev = "6cf4f2c9e066bcf398b371719c90173fae223dbf" }
