[package]
name = "bulin"
version.workspace = true
edition.workspace = true

[workspace]
resolver = "3"
members = ["core"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# The package is prefixed because a bare `core` collides with the standard library's.
bulin-core = { path = "core" }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
# naga-ext matches the wgsl-types feature wgsl-analyzer turns on; without it wgsl-parse fails to build.
wesl = { version = "0.6", features = ["naga-ext"] }
wgsl-types = "0.6"

[dependencies]
bulin-core = { workspace = true }
iced = { version = "0.15.0-dev", default-features = false, features = [
    "wgpu",
    "webgl",
    "web-colors",
    "x11",
    "wayland",
    "tokio",
    "debug",
    "image",
    "advanced",
    "canvas",
    "fira-sans",
] }
iced_palace = "0.15.0-dev"
matcha-core = { git = "https://github.com/NickelWenzel/matcha.git", rev = "6781192ab387366f482f31fc0b6940b2110353d1", default-features = false, features = [
    "tree-sitter",
] }
matcha-iced = { git = "https://github.com/NickelWenzel/matcha.git", rev = "6781192ab387366f482f31fc0b6940b2110353d1", default-features = false, features = [
    "tree-sitter",
    "lsp",
] }
tree-sitter-wesl = "0.1.0"
once_cell = "1.21"
rfd = "0.17.2"
serde_json = { workspace = true }
num-traits = "0.2.19"
wasmtimer = { version = "0.4" }
thiserror = { workspace = true }
tracing = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing-subscriber = "0.3"
tokio = { version = "1.54.1", default-features = false, features = ["fs", "rt"] }
notify-debouncer-full = "0.7.0"
wgsl-analyzer = { git = "https://github.com/wgsl-analyzer/wgsl-analyzer", rev = "cc19e9698fc0826288fa6416b11df86dd8d60e3d" }
paths = { git = "https://github.com/wgsl-analyzer/wgsl-analyzer", rev = "cc19e9698fc0826288fa6416b11df86dd8d60e3d" }
anyhow = "1.0.104"
rayon = "1.12"
tempfile = "3"
dirs = "6.0"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1.54.1", features = ["time"] }
# Runs the analyzer's event stream out of a task, as the iced runtime would.
iced_runtime = { git = "https://github.com/iced-rs/iced.git", rev = "10e9b995eb5af74dbac08ed62b01971fe7e495b2" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }
console_error_panic_hook = "0.1"
console_log = "1.0"
wasm-bindgen = "0.2.108"
wasm-bindgen-futures = "0.4.58"
idb = "0.6.5"
# Imports check a picked file's size before reading it, through the `web_sys::File`.
rfd = { version = "0.17.2", features = ["file-handle-inner"] }
js-sys = "0.3.85"
web-sys = { version = "0.3.85", features = [
    "BeforeUnloadEvent",
    "Blob",
    "Document",
    "DomException",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "HtmlElement",
    "HtmlInputElement",
    "Navigator",
    "Storage",
    "StorageManager",
    "Window",
] }
# Plain `deflate` also pulls in zopfli, which import and export don't need.
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# console_log is a `log` backend; this forwards tracing's events to it.
tracing = { version = "0.1", features = ["log"] }

[patch.crates-io]
iced = { git = "https://github.com/iced-rs/iced.git", rev = "10e9b995eb5af74dbac08ed62b01971fe7e495b2" }
iced_core = { git = "https://github.com/iced-rs/iced.git", rev = "10e9b995eb5af74dbac08ed62b01971fe7e495b2" }
iced_widget = { git = "https://github.com/iced-rs/iced.git", rev = "10e9b995eb5af74dbac08ed62b01971fe7e495b2" }
iced_palace = { git = "https://github.com/hecrj/iced_palace.git" }
